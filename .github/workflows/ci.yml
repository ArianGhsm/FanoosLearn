name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2, Node 24
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, pdo_mysql
          coverage: none
      - name: Lint PHP
        run: find apps ops scripts tests \( -name '*.php' -o -name '*.php.example' \) -print0 | xargs -0 -n1 php -l
      - name: Static and unit contracts
        run: php scripts/db/check.php
      - name: Repository safety checks
        run: |
          php scripts/ci/check-secrets.php
          php scripts/ci/check-text.php
      - name: Exact-commit release artifact
        run: php scripts/ops/build-release.php "$GITHUB_SHA"

  web-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Web syntax and integrated UX checks
        run: |
          php -l apps/platform/public/index.php
          node --check apps/platform/public/assets/app.js
          node --check apps/platform/public/assets/domain-ux.js
          python3 tests/ux/worker01_static_quality.py
          node tests/ux/worker02_domain_ux_test.js
          node tests/ux/integration_web_ux_test.js

  python-bot-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify supported Python runtime
        run: |
          python3 - <<'PY'
          import sys
          version = sys.version_info[:2]
          if not ((3, 11) <= version < (3, 15)):
              raise SystemExit(f"Unsupported Python runtime: {sys.version}")
          print(sys.version)
          PY
      - name: Deterministic Telegram Bale and worker tests
        run: bash ops/stage7-bots/run-deterministic-tests.sh

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: fanoos_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2, Node 24
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_mysql
          coverage: none
      - name: Migration and tenant isolation integration tests
        env:
          FANOOS_TEST_MODE: all
          FANOOS_ALLOW_TEST_DB: '1'
          FANOOS_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=fanoos_ci_test;charset=utf8mb4
          FANOOS_DB_USER: root
          FANOOS_DB_PASSWORD: root-test-password
          FANOOS_LEGACY_ID_HMAC_KEY: ci-only-not-a-production-secret
        run: php tests/run.php
