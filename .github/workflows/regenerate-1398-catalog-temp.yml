name: Temporary 1398 reference catalog regeneration
on:
  push:
    branches:
      - fix/1398-complete-official-reference-list-20261010
    paths:
      - .github/workflows/regenerate-1398-catalog-temp.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/1398-complete-official-reference-list-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild from exact notices
        run: python scripts/import/reference_map_to_catalog.py
      - name: Verify 1398 boundaries
        run: python -m unittest discover -s tests/import -p test_reference_map_1398.py -v
      - name: Commit generated file to this branch
        run: |
          if ! git diff --quiet -- data/bank/catalog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/bank/catalog.json
            git commit -m 'build(catalog): regenerate complete 1398 official reference validity'
            git push origin HEAD:refs/heads/fix/1398-complete-official-reference-list-20261010
          fi
