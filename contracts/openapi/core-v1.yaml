openapi: 3.1.0
info:
  title: Fanoos Core API
  version: 1.3.0
  description: Canonical human/browser API. Mutating authenticated operations require the existing session CSRF contract.
servers:
  - url: /api/v1
security:
  - bearerSession: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identifier, password], properties: { identifier: { type: string }, password: { type: string } }, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post:
      operationId: logout
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /account:
    get: { operationId: getCanonicalAccount, responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces:
    get: { operationId: listMembershipWorkspaces, responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/select:
    post:
      operationId: selectWorkspace
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [workspace_id], properties: { workspace_id: { $ref: '#/components/schemas/Uuid' } }, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /messaging/link-challenges:
    post:
      operationId: createMessagingLinkChallenge
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [platform], properties: { platform: { type: string, enum: [telegram, bale] } }, additionalProperties: false } } } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '429': { $ref: '#/components/responses/Error' } }
  /messaging/links/{platform}/revoke:
    post:
      operationId: revokeMessagingLink
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
        - { name: platform, in: path, required: true, schema: { type: string, enum: [telegram, bale] } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /payments/callback:
    post:
      security: []
      operationId: verifyPaymentCallback
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/dashboard:
    get: { operationId: getGlobalAdminDashboard, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/academics:
    get: { operationId: getAcademicNavigation, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/schedule:
    get:
      operationId: listSchedule
      description: Interprets from/to as inclusive local calendar dates in the canonical tenant_workspaces.timezone_name and returns the matching canonical schedule events. Host and browser timezones are not authoritative.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /workspaces/{workspaceId}/grades/me:
    get: { operationId: listMyPublishedGrades, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/announcements:
    get: { operationId: listAnnouncements, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: course_id, in: query, required: false, description: Optional active course scope; interpreted only within the selected workspace., schema: { $ref: '#/components/schemas/Uuid' } }], responses: { '200': { $ref: '#/components/responses/Success' } } }
    post: { operationId: publishAnnouncement, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/announcements/{announcementId}/read:
    post:
      operationId: markAnnouncementRead
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: announcementId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /workspaces/{workspaceId}/notifications:
    get:
      operationId: listPersonalNotifications
      description: Returns the authenticated member's persisted web notification projection for the selected workspace. Results are tenant- and recipient-scoped and may be paginated with an opaque cursor.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: notificationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/notification-preferences:
    get:
      operationId: getNotificationPreferences
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
    patch:
      operationId: updateNotificationPreferences
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                in_app_enabled: { type: boolean }
                email_enabled: { type: boolean }
                push_enabled: { type: boolean }
                snoozed_until: { type: [string, 'null'], format: date-time }
              additionalProperties: false
      responses: { '200': { $ref: '#/components/responses/Success' }, '422': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/forms:
    get: { operationId: listOpenForms, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
    post: { operationId: createForm, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/forms/{formId}/submissions:
    post:
      operationId: submitForm
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: formId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '201': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/search:
    get:
      operationId: searchWorkspace
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: q, in: query, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /workspaces/{workspaceId}/admin/members:
    get: { operationId: listScopedMembers, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/admin/representatives:
    post: { operationId: assignRepresentative, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/admin/dashboard:
    get: { operationId: getScopedAdminDashboard, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/orders:
    get: { operationId: listMyOrders, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
    post: { operationId: createOrder, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' }, '503': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/catalog:
    get:
      operationId: listPurchasableCatalog
      description: Returns active server-priced products bound to a workspace, course, assessment or resource scope. The client must treat amount, currency and access status as read-only projections; private object addresses and payment proof are never returned.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/payments/{attemptId}/reconcile:
    post:
      operationId: reconcilePayment
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: attemptId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/entitlements:
    get:
      operationId: listMyEntitlements
      description: Returns the authenticated member's access library with independent active, expired, revoked or pending states. Payment success is not treated as access.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
    post: { operationId: grantEntitlement, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/entitlements/{grantId}/revoke:
    post:
      operationId: revokeEntitlement
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: grantId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /workspaces/{workspaceId}/entitlements/check:
    get: { operationId: checkEntitlement, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: scope_id, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/resources:
    get:
      operationId: listResourceLibrary
      description: Returns a workspace-scoped catalog. Producer/reviewer projections include safe version status and opaque version identifiers only; storage keys and private object paths are never returned.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 120 } }, { name: type, in: query, schema: { type: string, maxLength: 64 } }, { name: course_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }, { name: status, in: query, schema: { type: string, enum: [draft, review, published, archived, deleted] } }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post: { operationId: createStructuredResource, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/resources/{resourceId}:
    patch: { operationId: updateResourceMetadata, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } } }
    get: { operationId: viewAuthorizedResource, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/resources/{resourceId}/authorize:
    get: { operationId: authorizeProtectedResource, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/resources/{resourceId}/versions:
    get: { operationId: listResourceVersions, description: Returns only version metadata and structured content for scoped producer/reviewer access; object storage addresses are excluded., parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } } }
    post: { operationId: createResourceVersion, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/resources/{resourceId}/versions/{versionId}/derive:
    post: { operationId: deriveResourceOutput, description: Creates a generated draft from an approved source version and records source/version/transformation lineage., parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/resources/{resourceId}/versions/{versionId}/review-request:
    post: { operationId: requestResourceReview, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/resources/{resourceId}/versions/{versionId}/review:
    post: { operationId: reviewResourceVersion, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/resources/{resourceId}/versions/{versionId}/publish:
    post: { operationId: publishResourceVersion, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/resources/{resourceId}/deliveries:
    post: { operationId: issueProtectedDelivery, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/deliveries/consume:
    post: { operationId: consumeProtectedDelivery, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/downloads/consume:
    post:
      operationId: redeemAuthorizedObjectDownload
      description: Redeems a short-lived workspace-bound object capability only after current session, workspace, resource authorization, entitlement, exact resource version and object identity are revalidated. The capability is supplied in the POST body and must never be placed in a user-visible URL.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [download_token]
              properties: { download_token: { type: string, minLength: 16, maxLength: 4096 } }
              additionalProperties: false
      responses:
        '200':
          description: Authorized bounded object bytes.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workspaces/{workspaceId}/assessments:
    get:
      operationId: listPublishedAssessments
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: course_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [practice, quiz, mock_exam, past_exam] } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post: { operationId: createAssessmentDraft, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '201': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/assessments/{assessmentId}/versions/{versionId}/review-request:
    post: { operationId: requestAssessmentReview, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AssessmentId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/assessments/{assessmentId}/versions/{versionId}/review:
    post: { operationId: reviewAssessmentVersion, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AssessmentId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/assessments/{assessmentId}/versions/{versionId}/publish:
    post: { operationId: publishAssessmentVersion, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AssessmentId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/assessments/{assessmentId}/attempts:
    post:
      operationId: startAssessmentAttempt
      description: Starts or resumes an in-progress attempt. Returns attempt metadata, the title, any already-saved answers and the question count -- never question content. Questions are fetched one at a time from the questions/{position} route below, so this response is identical (and cheap) whether the attempt is new or being resumed.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AssessmentId' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '201': { $ref: '#/components/responses/AssessmentAttemptStarted' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/assessments/{assessmentId}/analytics:
    get: { operationId: getAssessmentAnalytics, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AssessmentId' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/attempts/{attemptId}:
    patch: { operationId: saveAssessmentProgress, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/attempts/{attemptId}/questions/{position}:
    get:
      operationId: readAssessmentQuestion
      description: Returns exactly one question of an in-progress attempt the caller owns, by its 1-based position in that attempt's per-attempt shuffled order (ExamAttemptShuffle) -- never the answer or explanation. Reads are paced by a per-user token bucket (a small burst, then a slow sustained rate); a caller reading past the burst receives 429 until the bucket refills.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/PositionIndex' }]
      responses: { '200': { $ref: '#/components/responses/AssessmentQuestion' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/attempts/{attemptId}/submit:
    post: { operationId: submitAndScoreAssessment, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/Csrf' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /workspaces/{workspaceId}/attempts/{attemptId}/review:
    get:
      operationId: reviewAssessmentAttempt
      description: Scored-attempt summary only (score, correct/question counts) -- never the per-question review list. Explanations and per-choice correctness are served one at a time by the review/questions/{position} route below.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AttemptId' }]
      responses: { '200': { $ref: '#/components/responses/AssessmentAttemptReviewSummary' } }
  /workspaces/{workspaceId}/attempts/{attemptId}/review/questions/{position}:
    get:
      operationId: readAssessmentReviewQuestion
      description: Returns one reviewed question -- selection, correct choice and explanation -- of a scored attempt the caller owns, by the same per-attempt position readAssessmentQuestion used. Paced by the same per-user token bucket and audited the same way.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/PositionIndex' }]
      responses: { '200': { $ref: '#/components/responses/AssessmentReviewQuestion' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
components:
  securitySchemes:
    bearerSession: { type: http, scheme: bearer }
  schemas:
    Uuid: { type: string, format: uuid }
    Envelope:
      type: object
      required: [ok, data, meta]
      properties: { ok: { const: true }, data: {}, meta: { type: object, required: [api_version, request_id], properties: { api_version: { const: v1 }, request_id: { type: string } } } }
    ErrorEnvelope:
      type: object
      required: [ok, error, meta]
      properties: { ok: { const: false }, error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }, meta: { type: object } }
    AssessmentAttemptStarted:
      type: object
      required: [attempt_id, revision, status, assessment_id, title, answers, resumed, question_count]
      properties:
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, minimum: 1 }
        status: { const: in_progress }
        assessment_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        answers: { type: object, description: 'Question id -> previously-saved displayed choice index.', additionalProperties: { type: integer } }
        resumed: { type: boolean }
        question_count: { type: integer, minimum: 1 }
      additionalProperties: false
    AssessmentQuestion:
      type: object
      required: [position, question_count, question]
      properties:
        position: { type: integer, minimum: 1 }
        question_count: { type: integer, minimum: 1 }
        question:
          type: object
          description: Never includes answer or explanation. Choice order is permuted deterministically per attempt.
          required: [id, prompt, choices]
          properties:
            id: { type: string }
            prompt: { type: string }
            choices: { type: array, items: { type: string }, minItems: 2 }
            topic: { type: string }
            difficulty: { type: string, enum: [easy, medium, hard] }
            tags: { type: array, items: { type: string } }
            provenance: { type: object }
          additionalProperties: false
      additionalProperties: false
    AssessmentAttemptReviewSummary:
      type: object
      required: [id, assessment_id, revision, status, correct_count, question_count, score_basis_points]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assessment_id: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer }
        status: { type: string }
        correct_count: { type: integer, minimum: 0 }
        question_count: { type: integer, minimum: 0 }
        score_basis_points: { type: integer, minimum: 0, maximum: 10000 }
      additionalProperties: false
    AssessmentReviewQuestion:
      type: object
      required: [position, question_count, question_id, correct, is_correct]
      properties:
        position: { type: integer, minimum: 1 }
        question_count: { type: integer, minimum: 1 }
        question_id: { type: string }
        selected: { type: [integer, 'null'] }
        correct: { type: integer }
