openapi: 3.1.0
info:
  title: Fanoos Internal Service API
  version: 1.1.0
  description: |
    Signed service-only API for Telegram, Bale and narrow workers. Human bearer sessions and browser CSRF are not accepted here.
    Every request is signed over the exact raw body using HMAC-SHA256. Canonical bytes are:
    `fanoos-service-v1\nMETHOD\nPATH\nUNIX_SECONDS\nNONCE\nLOWERCASE_SHA256_RAW_BODY`.
    Required headers are X-Fanoos-Key-Id, X-Fanoos-Timestamp, X-Fanoos-Nonce,
    X-Fanoos-Content-SHA256 and X-Fanoos-Signature. Timestamp skew is at most 300 seconds and nonces are persisted to reject replay.
servers:
  - url: /api/internal/v1
security:
  - serviceKey: []
paths:
  /messaging/link-challenges/consume:
    post:
      operationId: consumeMessagingLinkChallenge
      x-required-service-action: messaging.link.consume
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkConsume' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /messaging/links/revoke:
    post:
      operationId: revokeLinkedMessagingSubject
      x-required-service-action: messaging.link.revoke
      description: Revokes only the canonical link addressed by the signed adapter's own platform plus subject. No user_id or link_id is accepted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedSubject' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /messaging/workspaces/list:
    post:
      operationId: listLinkedWorkspaces
      x-required-service-action: messaging.workspace.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedSubject' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /messaging/workspaces/select:
    post:
      operationId: selectLinkedWorkspace
      x-required-service-action: messaging.workspace.select
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedWorkspace' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /academics/schedule:
    post:
      operationId: getBotSchedule
      x-required-service-action: academic.schedule.read
      description: Returns a bounded local-date range in the canonical workspace timezone. Today/tomorrow are expressed as workspace-local YYYY-MM-DD dates.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /academics/grades:
    post:
      operationId: getBotSelfGrades
      x-required-service-action: grade.self.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PagedWorkspaceRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /announcements/list:
    post:
      operationId: listBotAnnouncements
      x-required-service-action: announcement.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /announcements/publish:
    post:
      operationId: publishBotAnnouncement
      x-required-service-action: announcement.publish
      description: >-
        Workspace-scoped notification.broadcast, already held by cohort-representative -- this is the same
        WorkspacePlatformService::publishAnnouncement the web API calls, exposed to the bot for the first
        time. Title and body are required and re-validated server-side regardless of what the bot already
        checked; publishing enqueues delivery through the existing notification_messages/outbox pipeline,
        never a parallel one.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementCompose' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /content/resources/list:
    post:
      operationId: listBotAccessibleResources
      x-required-service-action: content.catalog.read
      description: Returns only canonical resource/version identifiers and safe catalog metadata after current RBAC/entitlement authorization. Storage paths and object keys are never returned.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PagedWorkspaceRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /commerce/orders:
    post:
      operationId: createBotOrder
      x-required-service-action: commerce.order.create
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrder' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '503': { $ref: '#/components/responses/Error' } }
  /commerce/orders/status:
    post:
      operationId: getBotOrderStatus
      x-required-service-action: commerce.order.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderStatus' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /notifications/project:
    post:
      operationId: projectNotificationOutbox
      x-required-service-action: notification.project
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /notifications/claim:
    post:
      operationId: claimNotificationDelivery
      x-required-service-action: notification.claim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformOnly' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /notifications/receipt:
    post:
      operationId: recordNotificationReceipt
      x-required-service-action: notification.receipt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationReceipt' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /deliveries/issue:
    post:
      operationId: issueBotProtectedDelivery
      x-required-service-action: delivery.issue
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryIssue' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /deliveries/consume:
    post:
      operationId: consumeBotProtectedDelivery
      x-required-service-action: delivery.consume
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryConsume' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /deliveries/receipt:
    post:
      operationId: recordProtectedDeliveryReceipt
      x-required-service-action: delivery.receipt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryReceipt' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/enqueue:
    post:
      operationId: enqueueProtectedMedia
      x-required-service-action: protected_media.enqueue
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaEnqueue' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/claim:
    post:
      operationId: claimProtectedMedia
      x-required-service-action: protected_media.claim
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/source/redeem:
    post:
      operationId: redeemProtectedMediaSource
      x-required-service-action: protected_media.source.redeem
      description: Worker-only redemption of the opaque source capability. The response contains PDF bytes, never a filesystem path, storage key, bucket credential or unrestricted URL.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaSourceRedeem' } } } }
      responses:
        '200':
          description: Authorized bounded source PDF bytes.
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /protected-media/artifacts/authorize-publish:
    post:
      operationId: authorizeProtectedMediaArtifactPublish
      x-required-service-action: protected_media.artifact.authorize
      description: Binds job/lease/completion metadata plus expected checksum, size and MIME in a signed JSON request and returns a short-lived upload capability.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaArtifactAuthorize' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /protected-media/artifacts/publish:
    post:
      operationId: publishProtectedMediaArtifact
      x-required-service-action: protected_media.artifact.publish
      description: Worker-only raw PDF upload. X-Fanoos-Upload-Capability is separately signed and bound to job/checksum/size/MIME; normal service HMAC also covers the exact PDF body.
      parameters:
        - in: header
          name: X-Fanoos-Upload-Capability
          required: true
          schema: { type: string, minLength: 16, maxLength: 2048 }
      requestBody:
        required: true
        content: { application/pdf: { schema: { type: string, format: binary } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /protected-media/complete:
    post:
      operationId: completeProtectedMedia
      x-required-service-action: protected_media.complete
      description: Completion succeeds only when result metadata matches the canonically published artifact for the same job.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaComplete' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /protected-media/fail:
    post:
      operationId: failProtectedMedia
      x-required-service-action: protected_media.fail
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaFail' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/derivatives/issue:
    post:
      operationId: issueProtectedMediaDerivative
      x-required-service-action: protected_media.derivative.issue
      description: Reauthorizes the linked canonical user and exact resource version before issuing a short-lived user/platform/job-bound artifact capability.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaDerivativeIssue' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /protected-media/derivatives/redeem:
    post:
      operationId: redeemProtectedMediaDerivative
      x-required-service-action: protected_media.derivative.redeem
      description: Freshly reauthorizes before returning personalized PDF bytes; it never falls back to the original source object.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaDerivativeRedeem' } } } }
      responses:
        '200':
          description: Authorized personalized PDF bytes.
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /protected-media/forensic/candidates:
    post:
      operationId: listProtectedMediaForensicCandidates
      x-required-service-action: protected_media.forensic.candidates
      description: Owner-only. Returns exactly the recipients who were actually issued a fanoos-raster-v2 derivative of the given resource in the given workspace -- never a search across other workspaces or resources. Requires the platform-scoped protected_media.forensic.investigate permission.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForensicCandidates' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /protected-media/forensic/source:
    post:
      operationId: redeemProtectedMediaForensicSource
      x-required-service-action: protected_media.forensic.source
      description: Owner-only. job_id must be a completed fanoos-raster-v2 candidate job in the caller's own workspace; the object/version/classification tuple is read from that job's own row server-side, never accepted from the caller, so this can never be turned into a general "fetch any verified object" capability. Returns the bounded original PDF bytes (bounded by that job's own recorded max_input_bytes) so the detector can recompute the same source hash the worker bound into the mark. No storage path or credential is exposed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForensicSource' } } } }
      responses:
        '200':
          description: Bounded original PDF bytes.
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /protected-media/forensic/resources:
    post:
      operationId: listProtectedMediaForensicResources
      x-required-service-action: protected_media.forensic.resources
      description: Owner-only. Every resource in the given workspace that has at least one completed fanoos-raster-v2 candidate job, paginated -- lets the bot offer a resource picker instead of asking the owner to type a resource UUID. Requires the platform-scoped protected_media.forensic.investigate permission; uses the same non-membership authorization as candidates/source.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PagedWorkspaceRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /deployments/overview:
    post:
      operationId: getOwnerDeploymentOverview
      x-required-service-action: deployment.overview
      description: Telegram-only read projection. Unauthorized linked users receive only can_manage_deployments=false. Authorized users receive safe updater-side snapshot and last deployment metadata; no shell command, secret, environment value, raw log or PII is exposed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentOverview' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /deployments/request:
    post:
      operationId: requestCanonicalMainDeployment
      description: Does not accept repository, remote, branch, ref, SHA, path, command or shell fields. Candidate resolution occurs only inside the privileged updater.
      x-required-service-action: deployment.request
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /deployments/status:
    post:
      operationId: getDeploymentStatus
      x-required-service-action: deployment.status
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentStatus' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /onboarding/directory/provinces:
    post:
      operationId: listOnboardingProvinces
      x-required-service-action: onboarding.directory.read
      description: Open catalog read (no linked account required). Returns only country/province identity; never workspace, cohort or membership data.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryProvincesRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /onboarding/directory/institutions:
    post:
      operationId: listOnboardingInstitutions
      x-required-service-action: onboarding.directory.read
      description: Institutions narrowed by a province already returned from /onboarding/directory/provinces, paginated.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryInstitutionsRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /onboarding/directory/faculties:
    post:
      operationId: listOnboardingFaculties
      x-required-service-action: onboarding.directory.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryFacultiesRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /onboarding/directory/programs:
    post:
      operationId: listOnboardingPrograms
      x-required-service-action: onboarding.directory.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryProgramsRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /onboarding/directory/cohorts:
    post:
      operationId: listJoinableOnboardingCohorts
      x-required-service-action: onboarding.directory.read
      description: Cohorts under a program that already have a live class to join. Unlike the province/institution/faculty/program reads above, this deliberately does expose cohort and workspace identity -- it is the one directory read whose purpose is confirming a specific class exists, for a caller who has already narrowed down to one program.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryCohortsRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /onboarding/otp/request:
    post:
      operationId: requestOnboardingOtp
      x-required-service-action: onboarding.otp.request
      description: Pre-workspace phone verification. No canonical account or workspace membership exists yet for the caller; identity is scoped to the calling bot platform + subject only, and verifying a phone grants no membership on its own.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingOtpRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' }, '502': { $ref: '#/components/responses/Error' } }
  /onboarding/otp/resend:
    post:
      operationId: resendOnboardingOtp
      x-required-service-action: onboarding.otp.resend
      description: Reuses the challenge_token from /onboarding/otp/request; issues a new code without extending the outer 10-minute session.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingOtpResend' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /onboarding/otp/verify:
    post:
      operationId: verifyOnboardingOtp
      x-required-service-action: onboarding.otp.verify
      description: Single-use; a correct code marks the calling platform subject's phone verified but grants no workspace membership on its own.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingOtpVerify' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /onboarding/otp/status:
    post:
      operationId: getOnboardingOtpStatus
      x-required-service-action: onboarding.otp.status
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedSubject' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /onboarding/join:
    post:
      operationId: joinClassFromOnboarding
      x-required-service-action: onboarding.join
      description: >-
        Turns a completed join wizard into a real membership, or reports honestly that no live class matches
        yet (response data.status is 'joined' or 'class_not_found' -- this is not an error response, since no
        match is an expected, common outcome the caller must display, not a failure). Requires a phone already
        verified for this (platform, subject) via /onboarding/otp/verify. Finds-or-creates the canonical account
        by that verified phone and links the calling platform subject to it either way; only a match additionally
        creates a tenant_workspace_memberships row, at the limited 'workspace-limited-member' role, never full
        membership. Idempotent: submitting the same (subject, program, entry_year) twice does not create a
        second membership, and a person already a member of a different class is unaffected there.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingJoin' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /onboarding/upgrade-request:
    post:
      operationId: requestWorkspaceRoleUpgrade
      x-required-service-action: onboarding.upgrade_request
      description: >-
        Records a durable, idempotent request from a limited member asking their class representative to
        upgrade them to the full 'student' role. Approval itself is the /representatives/requests/* family
        below. Repeated calls for the same (subject, workspace) return the existing request's status rather
        than creating a second one.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingUpgradeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /onboarding/class-creation-requests:
    post:
      operationId: requestClassCreationFromOnboarding
      x-required-service-action: onboarding.class_creation_request
      description: >-
        Capability 5's seam only: records that a verified person asked for a program+entry_year with no live
        class, so a join wizard that reaches a dead end is never silent about it. Nothing here notifies an
        owner or creates a class -- that consumption side is a separate, later capability. Idempotent per
        (subject, program, entry_year); requires a phone already verified via /onboarding/otp/verify.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingClassCreationRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /classes:
    post:
      operationId: createClass
      x-required-service-action: workspace.provision
      description: >-
        Platform-owner-only. Resolves or creates the directory chain (country, province, city, institution,
        faculty, optional department, program, cohort) the identity names and finds or creates the
        tenant_workspaces row at its leaf. Transactional and idempotent: the same identity submitted twice
        returns the same workspace and never duplicates a directory row at any level.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassProvision' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /representatives/workspaces:
    post:
      operationId: listActiveWorkspacesForAppointment
      x-required-service-action: representative.workspaces.read
      description: >-
        Platform-owner-only. Every active class, paginated, for the appointment wizard's first step (pick which
        class). Authorized the same way /classes is: workspace.provision at platform scope.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerPagedRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /representatives/candidates:
    post:
      operationId: listAppointableMembers
      x-required-service-action: representative.candidates.read
      description: >-
        A workspace's active members, paginated, for the appointment wizard's second step (pick who to
        appoint). Deliberately separate from the admin dashboard's unpaginated roster read; only id and a
        display label are returned.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PagedWorkspaceRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /representatives/appoint:
    post:
      operationId: appointRepresentative
      x-required-service-action: representative.appoint
      description: >-
        Platform-owner-only (membership.manage, workspace-scoped -- the platform scope is always an ancestor of
        a workspace scope, so a platform owner satisfies this the same way any workspace-scoped permission
        check does). The target must already be an active member of the workspace; the join wizard is the only
        identity path -- this promotes an existing member, it does not name a new person. Idempotent: appointing
        an already-appointed representative again changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepresentativeAppoint' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /representatives/requests/list:
    post:
      operationId: listPendingUpgradeRequests
      x-required-service-action: representative.requests.read
      description: >-
        A representative's (or admin's) own approval queue: pending workspace role-upgrade requests for one
        workspace, filtered server-side by that workspace_id -- a representative of a different class never
        sees this list even if they can name another class's workspace_id. Requires membership.approve.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingUpgradeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /representatives/requests/approve:
    post:
      operationId: approveUpgradeRequest
      x-required-service-action: representative.requests.approve
      description: >-
        Approves a pending request: closes it and moves the member from 'workspace-limited-member' to the full
        'student' role for that workspace, both in one transaction -- neither ever applies without the other.
        Idempotent on an already-approved request; refused (409) on an already-declined one. The request_id is
        looked up scoped to workspace_id, so a request id from another class can never be approved here.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeRequestDecision' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /representatives/requests/decline:
    post:
      operationId: declineUpgradeRequest
      x-required-service-action: representative.requests.decline
      description: >-
        Ends a pending request in a terminal declined state rather than leaving it to linger. Idempotent on an
        already-declined request; refused (409) on an already-approved one.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeRequestDecision' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /classes/creation-requests/list:
    post:
      operationId: listPendingClassCreationRequests
      x-required-service-action: workspace.provision
      description: >-
        Platform-owner-only. Pending /onboarding/class-creation-requests rows grouped by
        (program_id, entry_year) -- several students asking for the same class are one row here,
        with a demand_count -- alongside resolved institution/faculty/program labels and the
        earliest requested_at, ordered oldest-demand-first. Authorized the same way /classes is:
        workspace.provision at platform scope, since reviewing a request to create a class is
        the same authority as creating one directly.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerPagedRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /classes/creation-requests/approve:
    post:
      operationId: approveClassCreationRequests
      x-required-service-action: workspace.provision
      description: >-
        Platform-owner-only. Hands the group's already-known directory identity (resolved from
        program_id up through faculty/institution/city/province/country) to
        ClassProvisioningService::createClass() together with the two fields a pending request
        cannot already answer -- the new cohort's label and the class's display name -- then
        marks every pending request in the (program_id, entry_year) group 'created', all in one
        transaction: a class created with requests left pending, or requests closed with no
        class, are both refused. Idempotent by directory identity -- a class that already exists
        (created manually, or by a concurrent approval) is reused, never duplicated.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassCreationRequestApprove' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /classes/creation-requests/decline:
    post:
      operationId: declineClassCreationRequests
      x-required-service-action: workspace.provision
      description: >-
        Platform-owner-only. Ends every pending request in the (program_id, entry_year) group in
        a terminal 'declined' state; a declined group has no pending requests left to approve
        afterward.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassCreationRequestGroup' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /institution-terms/institutions:
    post:
      operationId: listInstitutionsForTermSetting
      x-required-service-action: workspace.provision
      description: >-
        Platform-owner-only. Every active institution, paginated, for the term-setting wizard's
        first step (which institution). Authorized the same way /classes is: workspace.provision
        at platform scope.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerPagedRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /institution-terms/set:
    post:
      operationId: setInstitutionTerm
      x-required-service-action: workspace.provision
      description: >-
        Platform-owner-only. Sets or edits the institution's canonical term (docs/product/01_FRONT_DOOR.md
        #4: dates are configured once per institution, not re-typed per class) and materialises it
        into every currently active class under that institution in one transaction. A row a
        representative already overrode for their own class (POST /academic-terms/override) is left
        untouched rather than clobbered. Refuses end-before-start ranges before writing anything.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InstitutionTermSet' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /academic-terms/list:
    post:
      operationId: listWorkspaceAcademicTerms
      x-required-service-action: academic_term.workspace.read
      description: >-
        A workspace's own term rows (each labelled inherited or override), for the representative's
        override screen or anyone who can already view academic structures. Requires academic.view,
        workspace-scoped. Response data also carries can_override, a plain read of whether the
        caller separately holds academic.manage on this workspace -- lets a caller decide whether to
        offer the override action at all (the same probe-and-hide pattern already used for
        membership.approve); POST /academic-terms/override re-checks academic.manage itself
        regardless of what this flag said.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingUpgradeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /academic-terms/override:
    post:
      operationId: overrideClassAcademicTerm
      x-required-service-action: academic_term.workspace.override
      description: >-
        A representative (or admin) overriding their own class's term dates because they genuinely
        differ from the institution's canonical term. Requires academic.manage, workspace-scoped --
        already granted to cohort-representative (database/seeds/0010_representative_academic_manage.sql)
        alongside institution/faculty/program/workspace admins. Marks the row 'override' so a later
        institution-wide edit never overwrites it. Refuses end-before-start ranges before writing
        anything.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicTermOverride' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: X-Fanoos-Key-Id
      description: Key identifier only. Timestamp, nonce, exact raw-body digest and HMAC signature headers are also required.
  schemas:
    Uuid: { type: string, format: uuid }
    Platform: { type: string, enum: [telegram, bale] }
    Cursor: { type: [string, 'null'], maxLength: 32, pattern: '^[A-Za-z0-9_-]*$' }
    LinkedSubject:
      type: object
      required: [platform, subject]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 } }
      additionalProperties: false
    LinkedWorkspace:
      type: object
      required: [platform, subject, workspace_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    LinkConsume:
      type: object
      required: [platform, challenge_token, subject]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, challenge_token: { type: string, minLength: 1, maxLength: 128 }, subject: { type: string, minLength: 1, maxLength: 160 } }
      additionalProperties: false
    PagedWorkspaceRead:
      type: object
      required: [platform, subject, workspace_id]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        limit: { type: integer, minimum: 1, maximum: 100 }
        cursor: { $ref: '#/components/schemas/Cursor' }
      additionalProperties: false
    AnnouncementRead:
      type: object
      required: [platform, subject, workspace_id]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        limit: { type: integer, minimum: 1, maximum: 100 }
        cursor: { $ref: '#/components/schemas/Cursor' }
        course_id: { $ref: '#/components/schemas/Uuid' }
      additionalProperties: false
    AnnouncementCompose:
      type: object
      required: [platform, subject, workspace_id, title, body]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        course_id: { $ref: '#/components/schemas/Uuid' }
      additionalProperties: false
    ScheduleRead:
      type: object
      required: [platform, subject, workspace_id, from_date, to_date]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        limit: { type: integer, minimum: 1, maximum: 100 }
        cursor: { $ref: '#/components/schemas/Cursor' }
      additionalProperties: false
    PlatformOnly:
      type: object
      required: [platform]
      properties: { platform: { $ref: '#/components/schemas/Platform' } }
      additionalProperties: false
    CreateOrder:
      type: object
      required: [platform, subject, workspace_id, product_id, idempotency_key]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, product_id: { $ref: '#/components/schemas/Uuid' }, idempotency_key: { type: string, maxLength: 160 } }
      additionalProperties: false
    OrderStatus:
      type: object
      required: [platform, subject, workspace_id, order_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, order_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    NotificationReceipt:
      type: object
      required: [platform, delivery_id, lease_token, idempotency_key, outcome]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, delivery_id: { $ref: '#/components/schemas/Uuid' }, lease_token: { type: string }, idempotency_key: { type: string }, outcome: { type: string, enum: [delivered, retry, failed] }, provider_message_ref: { type: [string, 'null'] }, error_code: { type: [string, 'null'] } }
      additionalProperties: false
    DeliveryIssue:
      type: object
      required: [platform, subject, workspace_id, resource_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, resource_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    DeliveryConsume:
      type: object
      required: [platform, subject, workspace_id, delivery_token]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, delivery_token: { type: string } }
      additionalProperties: false
    DeliveryReceipt:
      type: object
      required: [platform, workspace_id, issuance_id, idempotency_key, outcome]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, workspace_id: { $ref: '#/components/schemas/Uuid' }, issuance_id: { $ref: '#/components/schemas/Uuid' }, idempotency_key: { type: string }, outcome: { type: string, enum: [delivered, failed] }, provider_message_ref: { type: [string, 'null'] }, error_code: { type: [string, 'null'] } }
      additionalProperties: false
    MediaEnqueue:
      type: object
      required: [workspace_id, issuance_id, renderer_algorithm_version]
      properties: { workspace_id: { $ref: '#/components/schemas/Uuid' }, issuance_id: { $ref: '#/components/schemas/Uuid' }, renderer_algorithm_version: { type: string, maxLength: 64 }, limits: { type: object, additionalProperties: { type: integer } } }
      additionalProperties: false
    MediaSourceRedeem:
      type: object
      required: [job_id, lease_token, object_capability]
      properties: { job_id: { $ref: '#/components/schemas/Uuid' }, lease_token: { type: string, minLength: 16 }, object_capability: { type: string, minLength: 16 } }
      additionalProperties: false
    MediaArtifactAuthorize:
      type: object
      required: [job_id, lease_token, completion_key, checksum_sha256, size, mime]
      properties:
        job_id: { $ref: '#/components/schemas/Uuid' }
        lease_token: { type: string, minLength: 16 }
        completion_key: { type: string, minLength: 32, maxLength: 160 }
        checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 5 }
        mime: { const: application/pdf }
      additionalProperties: false
    MediaComplete:
      type: object
      required: [job_id, lease_token, completion_key, result]
      properties:
        job_id: { $ref: '#/components/schemas/Uuid' }
        lease_token: { type: string }
        completion_key: { type: string }
        result:
          type: object
          required: [checksum_sha256, size, mime, artifact_ref]
          properties: { checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }, size: { type: integer, minimum: 1 }, mime: { const: application/pdf }, artifact_ref: { type: string, pattern: '^pma:[0-9a-f-]{36}$' } }
          additionalProperties: false
      additionalProperties: false
    MediaFail:
      type: object
      required: [job_id, lease_token, failure_code]
      properties: { job_id: { $ref: '#/components/schemas/Uuid' }, lease_token: { type: string }, failure_code: { type: string, enum: [input_unavailable, authorization_changed, input_too_large, page_limit, time_limit, render_failed, output_invalid, internal_error] } }
      additionalProperties: false
    MediaDerivativeIssue:
      type: object
      required: [platform, subject, workspace_id, job_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' }, job_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    MediaDerivativeRedeem:
      type: object
      required: [platform, subject, workspace_id, artifact_capability]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' }, artifact_capability: { type: string, minLength: 16, maxLength: 2048 } }
      additionalProperties: false
    ForensicCandidates:
      type: object
      required: [platform, subject, workspace_id, resource_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' }, resource_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    ForensicSource:
      type: object
      required: [platform, subject, workspace_id, job_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' }, job_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    DeploymentOverview:
      type: object
      required: [platform, subject, target_key]
      properties: { platform: { const: telegram }, subject: { type: string, minLength: 1, maxLength: 160 }, target_key: { type: string, pattern: '^[A-Za-z0-9._:-]{1,96}$' } }
      additionalProperties: false
    DeploymentRequest:
      type: object
      required: [platform, subject, target_key, idempotency_key]
      properties: { platform: { const: telegram }, subject: { type: string }, target_key: { type: string, pattern: '^[A-Za-z0-9._:-]{1,96}$' }, idempotency_key: { type: string, maxLength: 160 } }
      additionalProperties: false
    DeploymentStatus:
      type: object
      required: [platform, subject, request_id]
      properties: { platform: { const: telegram }, subject: { type: string }, request_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    DirectoryCode:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[A-Za-z0-9._-]{1,120}$'
    ClassProvision:
      type: object
      required: [platform, subject, country, province, city, institution, faculty, program, cohort, workspace]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        country:
          type: object
          required: [code, name]
          properties: { code: { type: string, pattern: '^[A-Za-z]{2}$' }, name: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        province:
          type: object
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        city:
          type: object
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        institution:
          type: object
          required: [name]
          properties: { slug: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 }, institution_type: { type: string, minLength: 1, maxLength: 32 } }
          additionalProperties: false
        faculty:
          type: object
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 } }
          additionalProperties: false
        department:
          type: [object, 'null']
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 } }
          additionalProperties: false
        program:
          type: object
          required: [name, degree_level]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 }, degree_level: { type: string, minLength: 1, maxLength: 48 } }
          additionalProperties: false
        cohort:
          type: object
          required: [entry_year, label]
          properties: { entry_year: { type: integer, minimum: 1000, maximum: 9999 }, label: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        workspace:
          type: object
          required: [name]
          properties: { name: { type: string, minLength: 1, maxLength: 200 } }
          additionalProperties: false
      additionalProperties: false
    DirectoryProvincesRead:
      type: object
      required: [platform]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, limit: { type: integer, minimum: 1, maximum: 50 }, cursor: { $ref: '#/components/schemas/Cursor' } }
      additionalProperties: false
    DirectoryInstitutionsRead:
      type: object
      required: [platform, province_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, province_id: { $ref: '#/components/schemas/Uuid' }, limit: { type: integer, minimum: 1, maximum: 50 }, cursor: { $ref: '#/components/schemas/Cursor' } }
      additionalProperties: false
    DirectoryFacultiesRead:
      type: object
      required: [platform, institution_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, institution_id: { $ref: '#/components/schemas/Uuid' }, limit: { type: integer, minimum: 1, maximum: 50 }, cursor: { $ref: '#/components/schemas/Cursor' } }
      additionalProperties: false
    DirectoryProgramsRead:
      type: object
      required: [platform, faculty_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, faculty_id: { $ref: '#/components/schemas/Uuid' }, limit: { type: integer, minimum: 1, maximum: 50 }, cursor: { $ref: '#/components/schemas/Cursor' } }
      additionalProperties: false
    DirectoryCohortsRead:
      type: object
      required: [platform, program_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, program_id: { $ref: '#/components/schemas/Uuid' }, limit: { type: integer, minimum: 1, maximum: 50 }, cursor: { $ref: '#/components/schemas/Cursor' } }
      additionalProperties: false
    OnboardingJoin:
      type: object
      required: [platform, subject, program_id, entry_year]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, program_id: { $ref: '#/components/schemas/Uuid' }, entry_year: { type: integer, minimum: 1000, maximum: 9999 } }
      additionalProperties: false
    OnboardingUpgradeRequest:
      type: object
      required: [platform, subject, workspace_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    OwnerPagedRead:
      type: object
      required: [platform, subject]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        cursor: { $ref: '#/components/schemas/Cursor' }
      additionalProperties: false
    RepresentativeAppoint:
      type: object
      required: [platform, subject, workspace_id, target_user_id]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        target_user_id: { $ref: '#/components/schemas/Uuid' }
      additionalProperties: false
    UpgradeRequestDecision:
      type: object
      required: [platform, subject, workspace_id, request_id]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        request_id: { $ref: '#/components/schemas/Uuid' }
      additionalProperties: false
    OnboardingClassCreationRequest:
      type: object
      required: [platform, subject, program_id, entry_year]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, program_id: { $ref: '#/components/schemas/Uuid' }, entry_year: { type: integer, minimum: 1000, maximum: 9999 } }
      additionalProperties: false
    ClassCreationRequestGroup:
      type: object
      required: [platform, subject, program_id, entry_year]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        program_id: { $ref: '#/components/schemas/Uuid' }
        entry_year: { type: integer, minimum: 1000, maximum: 9999 }
      additionalProperties: false
    ClassCreationRequestApprove:
      type: object
      required: [platform, subject, program_id, entry_year, cohort_label, workspace_name]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        program_id: { $ref: '#/components/schemas/Uuid' }
        entry_year: { type: integer, minimum: 1000, maximum: 9999 }
