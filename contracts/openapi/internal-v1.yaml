openapi: 3.1.0
info:
  title: Fanoos Internal Service API
  version: 1.1.0
  description: |
    Signed service-only API for Telegram, Bale and narrow workers. Human bearer sessions and browser CSRF are not accepted here.
    Every request is signed over the exact raw body using HMAC-SHA256. Canonical bytes are:
    `fanoos-service-v1\nMETHOD\nPATH\nUNIX_SECONDS\nNONCE\nLOWERCASE_SHA256_RAW_BODY`.
    Required headers are X-Fanoos-Key-Id, X-Fanoos-Timestamp, X-Fanoos-Nonce,
    X-Fanoos-Content-SHA256 and X-Fanoos-Signature. Timestamp skew is at most 300 seconds and nonces are persisted to reject replay.
servers:
  - url: /api/internal/v1
security:
  - serviceKey: []
paths:
  /messaging/link-challenges/consume:
    post:
      operationId: consumeMessagingLinkChallenge
      x-required-service-action: messaging.link.consume
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkConsume' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /messaging/links/revoke:
    post:
      operationId: revokeLinkedMessagingSubject
      x-required-service-action: messaging.link.revoke
      description: Revokes only the canonical link addressed by the signed adapter's own platform plus subject. No user_id or link_id is accepted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedSubject' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /messaging/workspaces/list:
    post:
      operationId: listLinkedWorkspaces
      x-required-service-action: messaging.workspace.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedSubject' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /messaging/workspaces/select:
    post:
      operationId: selectLinkedWorkspace
      x-required-service-action: messaging.workspace.select
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedWorkspace' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /academics/schedule:
    post:
      operationId: getBotSchedule
      x-required-service-action: academic.schedule.read
      description: Returns a bounded local-date range in the canonical workspace timezone. Today/tomorrow are expressed as workspace-local YYYY-MM-DD dates.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /academics/grades:
    post:
      operationId: getBotSelfGrades
      x-required-service-action: grade.self.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PagedWorkspaceRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /announcements/list:
    post:
      operationId: listBotAnnouncements
      x-required-service-action: announcement.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /content/resources/list:
    post:
      operationId: listBotAccessibleResources
      x-required-service-action: content.catalog.read
      description: Returns only canonical resource/version identifiers and safe catalog metadata after current RBAC/entitlement authorization. Storage paths and object keys are never returned.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PagedWorkspaceRead' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /commerce/orders:
    post:
      operationId: createBotOrder
      x-required-service-action: commerce.order.create
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrder' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '503': { $ref: '#/components/responses/Error' } }
  /commerce/orders/status:
    post:
      operationId: getBotOrderStatus
      x-required-service-action: commerce.order.read
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderStatus' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /notifications/project:
    post:
      operationId: projectNotificationOutbox
      x-required-service-action: notification.project
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /notifications/claim:
    post:
      operationId: claimNotificationDelivery
      x-required-service-action: notification.claim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformOnly' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /notifications/receipt:
    post:
      operationId: recordNotificationReceipt
      x-required-service-action: notification.receipt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationReceipt' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /deliveries/issue:
    post:
      operationId: issueBotProtectedDelivery
      x-required-service-action: delivery.issue
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryIssue' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /deliveries/consume:
    post:
      operationId: consumeBotProtectedDelivery
      x-required-service-action: delivery.consume
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryConsume' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /deliveries/receipt:
    post:
      operationId: recordProtectedDeliveryReceipt
      x-required-service-action: delivery.receipt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryReceipt' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/enqueue:
    post:
      operationId: enqueueProtectedMedia
      x-required-service-action: protected_media.enqueue
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaEnqueue' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/claim:
    post:
      operationId: claimProtectedMedia
      x-required-service-action: protected_media.claim
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/source/redeem:
    post:
      operationId: redeemProtectedMediaSource
      x-required-service-action: protected_media.source.redeem
      description: Worker-only redemption of the opaque source capability. The response contains PDF bytes, never a filesystem path, storage key, bucket credential or unrestricted URL.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaSourceRedeem' } } } }
      responses:
        '200':
          description: Authorized bounded source PDF bytes.
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /protected-media/artifacts/authorize-publish:
    post:
      operationId: authorizeProtectedMediaArtifactPublish
      x-required-service-action: protected_media.artifact.authorize
      description: Binds job/lease/completion metadata plus expected checksum, size and MIME in a signed JSON request and returns a short-lived upload capability.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaArtifactAuthorize' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /protected-media/artifacts/publish:
    post:
      operationId: publishProtectedMediaArtifact
      x-required-service-action: protected_media.artifact.publish
      description: Worker-only raw PDF upload. X-Fanoos-Upload-Capability is separately signed and bound to job/checksum/size/MIME; normal service HMAC also covers the exact PDF body.
      parameters:
        - in: header
          name: X-Fanoos-Upload-Capability
          required: true
          schema: { type: string, minLength: 16, maxLength: 2048 }
      requestBody:
        required: true
        content: { application/pdf: { schema: { type: string, format: binary } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /protected-media/complete:
    post:
      operationId: completeProtectedMedia
      x-required-service-action: protected_media.complete
      description: Completion succeeds only when result metadata matches the canonically published artifact for the same job.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaComplete' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /protected-media/fail:
    post:
      operationId: failProtectedMedia
      x-required-service-action: protected_media.fail
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaFail' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /protected-media/derivatives/issue:
    post:
      operationId: issueProtectedMediaDerivative
      x-required-service-action: protected_media.derivative.issue
      description: Reauthorizes the linked canonical user and exact resource version before issuing a short-lived user/platform/job-bound artifact capability.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaDerivativeIssue' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /protected-media/derivatives/redeem:
    post:
      operationId: redeemProtectedMediaDerivative
      x-required-service-action: protected_media.derivative.redeem
      description: Freshly reauthorizes before returning personalized PDF bytes; it never falls back to the original source object.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaDerivativeRedeem' } } } }
      responses:
        '200':
          description: Authorized personalized PDF bytes.
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /deployments/overview:
    post:
      operationId: getOwnerDeploymentOverview
      x-required-service-action: deployment.overview
      description: Telegram-only read projection. Unauthorized linked users receive only can_manage_deployments=false. Authorized users receive safe updater-side snapshot and last deployment metadata; no shell command, secret, environment value, raw log or PII is exposed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentOverview' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /deployments/request:
    post:
      operationId: requestCanonicalMainDeployment
      description: Does not accept repository, remote, branch, ref, SHA, path, command or shell fields. Candidate resolution occurs only inside the privileged updater.
      x-required-service-action: deployment.request
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /deployments/status:
    post:
      operationId: getDeploymentStatus
      x-required-service-action: deployment.status
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentStatus' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /classes:
    post:
      operationId: createClass
      x-required-service-action: workspace.provision
      description: >-
        Platform-owner-only. Resolves or creates the directory chain (country, province, city, institution,
        faculty, optional department, program, cohort) the identity names and finds or creates the
        tenant_workspaces row at its leaf. Transactional and idempotent: the same identity submitted twice
        returns the same workspace and never duplicates a directory row at any level.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassProvision' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: X-Fanoos-Key-Id
      description: Key identifier only. Timestamp, nonce, exact raw-body digest and HMAC signature headers are also required.
  schemas:
    Uuid: { type: string, format: uuid }
    Platform: { type: string, enum: [telegram, bale] }
    Cursor: { type: [string, 'null'], maxLength: 32, pattern: '^[A-Za-z0-9_-]*$' }
    LinkedSubject:
      type: object
      required: [platform, subject]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 } }
      additionalProperties: false
    LinkedWorkspace:
      type: object
      required: [platform, subject, workspace_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    LinkConsume:
      type: object
      required: [platform, challenge_token, subject]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, challenge_token: { type: string, minLength: 1, maxLength: 128 }, subject: { type: string, minLength: 1, maxLength: 160 } }
      additionalProperties: false
    PagedWorkspaceRead:
      type: object
      required: [platform, subject, workspace_id]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        limit: { type: integer, minimum: 1, maximum: 100 }
        cursor: { $ref: '#/components/schemas/Cursor' }
      additionalProperties: false
    AnnouncementRead:
      type: object
      required: [platform, subject, workspace_id]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        limit: { type: integer, minimum: 1, maximum: 100 }
        cursor: { $ref: '#/components/schemas/Cursor' }
        course_id: { $ref: '#/components/schemas/Uuid' }
      additionalProperties: false
    ScheduleRead:
      type: object
      required: [platform, subject, workspace_id, from_date, to_date]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        limit: { type: integer, minimum: 1, maximum: 100 }
        cursor: { $ref: '#/components/schemas/Cursor' }
      additionalProperties: false
    PlatformOnly:
      type: object
      required: [platform]
      properties: { platform: { $ref: '#/components/schemas/Platform' } }
      additionalProperties: false
    CreateOrder:
      type: object
      required: [platform, subject, workspace_id, product_id, idempotency_key]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, product_id: { $ref: '#/components/schemas/Uuid' }, idempotency_key: { type: string, maxLength: 160 } }
      additionalProperties: false
    OrderStatus:
      type: object
      required: [platform, subject, workspace_id, order_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, order_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    NotificationReceipt:
      type: object
      required: [platform, delivery_id, lease_token, idempotency_key, outcome]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, delivery_id: { $ref: '#/components/schemas/Uuid' }, lease_token: { type: string }, idempotency_key: { type: string }, outcome: { type: string, enum: [delivered, retry, failed] }, provider_message_ref: { type: [string, 'null'] }, error_code: { type: [string, 'null'] } }
      additionalProperties: false
    DeliveryIssue:
      type: object
      required: [platform, subject, workspace_id, resource_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, resource_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    DeliveryConsume:
      type: object
      required: [platform, subject, workspace_id, delivery_token]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string }, workspace_id: { $ref: '#/components/schemas/Uuid' }, delivery_token: { type: string } }
      additionalProperties: false
    DeliveryReceipt:
      type: object
      required: [platform, workspace_id, issuance_id, idempotency_key, outcome]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, workspace_id: { $ref: '#/components/schemas/Uuid' }, issuance_id: { $ref: '#/components/schemas/Uuid' }, idempotency_key: { type: string }, outcome: { type: string, enum: [delivered, failed] }, provider_message_ref: { type: [string, 'null'] }, error_code: { type: [string, 'null'] } }
      additionalProperties: false
    MediaEnqueue:
      type: object
      required: [workspace_id, issuance_id, renderer_algorithm_version]
      properties: { workspace_id: { $ref: '#/components/schemas/Uuid' }, issuance_id: { $ref: '#/components/schemas/Uuid' }, renderer_algorithm_version: { type: string, maxLength: 64 }, limits: { type: object, additionalProperties: { type: integer } } }
      additionalProperties: false
    MediaSourceRedeem:
      type: object
      required: [job_id, lease_token, object_capability]
      properties: { job_id: { $ref: '#/components/schemas/Uuid' }, lease_token: { type: string, minLength: 16 }, object_capability: { type: string, minLength: 16 } }
      additionalProperties: false
    MediaArtifactAuthorize:
      type: object
      required: [job_id, lease_token, completion_key, checksum_sha256, size, mime]
      properties:
        job_id: { $ref: '#/components/schemas/Uuid' }
        lease_token: { type: string, minLength: 16 }
        completion_key: { type: string, minLength: 32, maxLength: 160 }
        checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 5 }
        mime: { const: application/pdf }
      additionalProperties: false
    MediaComplete:
      type: object
      required: [job_id, lease_token, completion_key, result]
      properties:
        job_id: { $ref: '#/components/schemas/Uuid' }
        lease_token: { type: string }
        completion_key: { type: string }
        result:
          type: object
          required: [checksum_sha256, size, mime, artifact_ref]
          properties: { checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }, size: { type: integer, minimum: 1 }, mime: { const: application/pdf }, artifact_ref: { type: string, pattern: '^pma:[0-9a-f-]{36}$' } }
          additionalProperties: false
      additionalProperties: false
    MediaFail:
      type: object
      required: [job_id, lease_token, failure_code]
      properties: { job_id: { $ref: '#/components/schemas/Uuid' }, lease_token: { type: string }, failure_code: { type: string, enum: [input_unavailable, authorization_changed, input_too_large, page_limit, time_limit, render_failed, output_invalid, internal_error] } }
      additionalProperties: false
    MediaDerivativeIssue:
      type: object
      required: [platform, subject, workspace_id, job_id]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' }, job_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    MediaDerivativeRedeem:
      type: object
      required: [platform, subject, workspace_id, artifact_capability]
      properties: { platform: { $ref: '#/components/schemas/Platform' }, subject: { type: string, minLength: 1, maxLength: 160 }, workspace_id: { $ref: '#/components/schemas/Uuid' }, artifact_capability: { type: string, minLength: 16, maxLength: 2048 } }
      additionalProperties: false
    DeploymentOverview:
      type: object
      required: [platform, subject, target_key]
      properties: { platform: { const: telegram }, subject: { type: string, minLength: 1, maxLength: 160 }, target_key: { type: string, pattern: '^[A-Za-z0-9._:-]{1,96}$' } }
      additionalProperties: false
    DeploymentRequest:
      type: object
      required: [platform, subject, target_key, idempotency_key]
      properties: { platform: { const: telegram }, subject: { type: string }, target_key: { type: string, pattern: '^[A-Za-z0-9._:-]{1,96}$' }, idempotency_key: { type: string, maxLength: 160 } }
      additionalProperties: false
    DeploymentStatus:
      type: object
      required: [platform, subject, request_id]
      properties: { platform: { const: telegram }, subject: { type: string }, request_id: { $ref: '#/components/schemas/Uuid' } }
      additionalProperties: false
    DirectoryCode:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[A-Za-z0-9._-]{1,120}$'
    ClassProvision:
      type: object
      required: [platform, subject, country, province, city, institution, faculty, program, cohort, workspace]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        subject: { type: string, minLength: 1, maxLength: 160 }
        country:
          type: object
          required: [code, name]
          properties: { code: { type: string, pattern: '^[A-Za-z]{2}$' }, name: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        province:
          type: object
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        city:
          type: object
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        institution:
          type: object
          required: [name]
          properties: { slug: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 }, institution_type: { type: string, minLength: 1, maxLength: 32 } }
          additionalProperties: false
        faculty:
          type: object
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 } }
          additionalProperties: false
        department:
          type: [object, 'null']
          required: [name]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 } }
          additionalProperties: false
        program:
          type: object
          required: [name, degree_level]
          properties: { code: { $ref: '#/components/schemas/DirectoryCode' }, name: { type: string, minLength: 1, maxLength: 200 }, degree_level: { type: string, minLength: 1, maxLength: 48 } }
          additionalProperties: false
        cohort:
          type: object
          required: [entry_year, label]
          properties: { entry_year: { type: integer, minimum: 1000, maximum: 9999 }, label: { type: string, minLength: 1, maxLength: 160 } }
          additionalProperties: false
        workspace:
          type: object
          required: [name]
          properties: { name: { type: string, minLength: 1, maxLength: 200 } }
          additionalProperties: false
      additionalProperties: false
    SuccessEnvelope:
      type: object
      required: [ok, data, meta]
      properties: { ok: { const: true }, data: {}, meta: { type: object, properties: { api_version: { const: internal-v1 }, request_id: { type: string } } } }
    ErrorEnvelope:
      type: object
      required: [ok, error, meta]
      properties: { ok: { const: false }, error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }, meta: { type: object } }
  responses:
