<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>ساخت کارت</title>
    <style>
        @font-face{font-family:'YekanBakh';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/YekanBakh-Regular.woff2') format('woff2'),url('/fonts/YekanBakh-Regular.woff') format('woff')}
        @font-face{font-family:'YekanBakh';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/YekanBakh-Bold.woff2') format('woff2'),url('/fonts/YekanBakh-Bold.woff') format('woff')}
        @font-face{font-family:'B Nazanin';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/B Nazanin-.ttf') format('truetype')}
        @font-face{font-family:'B Nazanin';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/B Nazanin Bold-.ttf') format('truetype')}

        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

        :root{
            --c1:#ff6b9d;--c2:#c0397a;--c3:#ffe0ef;--bg:#0d0010;
        }

        html,body{
            min-height:100dvh;
            background:var(--bg);
            color:#fff;
            font-family:'YekanBakh',system-ui,sans-serif;
            -webkit-font-smoothing:antialiased;
            overflow-x:hidden;
        }

        /* canvas */
        #canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}

        /* toolbar */
        .toolbar{
            position:fixed;top:0;left:0;right:0;z-index:20;
            display:flex;align-items:center;justify-content:space-between;
            flex-wrap:wrap;gap:.5rem;
            padding:.6rem 1rem env(safe-area-inset-top,.6rem);
            background:rgba(13,0,16,.7);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(255,255,255,.06);
        }

        .toolbar-left{display:flex;align-items:center;gap:.5rem;}

        /* theme buttons */
        .theme-btn{
            width:1.35rem;height:1.35rem;border-radius:50%;
            border:2.5px solid transparent;cursor:pointer;
            transition:border-color .15s,transform .15s;
            outline:none;flex-shrink:0;
        }
        .theme-btn:hover,.theme-btn.active{border-color:#fff;transform:scale(1.18);}
        .theme-btn[data-theme="rose"]{background:#ff6b9d;}
        .theme-btn[data-theme="blue"]{background:#6b9dff;}
        .theme-btn[data-theme="gold"]{background:#ffd166;}
        .theme-btn[data-theme="mint"]{background:#66ffcc;}

        .toolbar-sep{width:1px;height:1.2rem;background:rgba(255,255,255,.15);margin:0 .25rem;}

        /* generate button */
        .gen-btn{
            padding:.45rem 1.1rem;border-radius:2rem;
            background:var(--c1);color:#fff;border:none;
            font-size:.82rem;font-weight:600;cursor:pointer;
            letter-spacing:.02em;transition:opacity .15s,transform .1s;
            white-space:nowrap;
        }
        .gen-btn:hover{opacity:.88;}
        .gen-btn:active{transform:scale(.97);}
        .gen-btn:disabled{opacity:.45;cursor:not-allowed;}

        .back-btn{
            font-size:.78rem;color:rgba(255,255,255,.45);
            text-decoration:none;padding:.3rem .5rem;
            border-radius:.4rem;transition:color .15s;white-space:nowrap;
        }
        .back-btn:hover{color:rgba(255,255,255,.8);}

        /* toast */
        #toast{
            position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(2rem);
            background:rgba(255,255,255,.1);backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,.15);
            color:#fff;border-radius:2rem;
            padding:.6rem 1.4rem;font-size:.85rem;
            z-index:100;opacity:0;transition:opacity .25s,transform .25s;
            pointer-events:none;white-space:nowrap;text-align:center;
        }
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        /* auth guard */
        #auth-guard{
            position:fixed;inset:0;z-index:50;
            display:flex;align-items:center;justify-content:center;
            background:var(--bg);
            font-size:.95rem;color:rgba(255,255,255,.5);
        }

        /* card editor */
        .editor{
            position:relative;z-index:1;
            min-height:100dvh;
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            padding:5.5rem 1.5rem 3rem;
            gap:1.8rem;
        }

        /* POV label */
        .pov-label{
            font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
            color:var(--c1);
            pointer-events:none;user-select:none;
        }

        /* editable inputs */
        .pov-input{
            width:100%;max-width:520px;
            background:transparent;border:none;outline:none;
            font-size:clamp(1.4rem,4.5vw,2.2rem);
            font-family:'B Nazanin','YekanBakh',sans-serif;
            font-weight:700;color:#fff;
            text-align:center;
            line-height:1.25;
            caret-color:var(--c1);
            text-shadow:0 0 40px var(--c2);
            border-bottom:1.5px solid rgba(255,255,255,.12);
            padding-bottom:.35rem;
            transition:border-color .2s;
        }
        .pov-input:focus{border-color:var(--c1);}
        .pov-input::placeholder{color:rgba(255,255,255,.2);}

        .divider{
            width:3rem;height:2px;
            background:linear-gradient(90deg,transparent,var(--c1),transparent);
        }

        /* lines area */
        .lines-area{
            display:flex;flex-direction:column;
            align-items:center;gap:.7rem;
            width:100%;max-width:520px;
        }

        .line-row{
            display:flex;align-items:center;gap:.4rem;width:100%;
        }

        .line-input{
            flex:1;
            background:transparent;border:none;outline:none;
            font-size:clamp(.92rem,2.5vw,1.08rem);
            color:rgba(255,255,255,.82);
            text-align:center;
            line-height:1.7;
            caret-color:var(--c1);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:.15rem 0;
            transition:border-color .2s;
        }
        .line-input:focus{border-color:rgba(255,255,255,.3);}
        .line-input::placeholder{color:rgba(255,255,255,.14);}

        .line-remove{
            width:1.4rem;height:1.4rem;border-radius:50%;
            background:transparent;border:none;cursor:pointer;
            color:rgba(255,255,255,.2);font-size:.9rem;
            flex-shrink:0;transition:color .15s;line-height:1;
            display:flex;align-items:center;justify-content:center;
        }
        .line-remove:hover{color:rgba(255,100,100,.7);}

        .add-line-btn{
            background:transparent;border:1px dashed rgba(255,255,255,.18);
            color:rgba(255,255,255,.3);border-radius:2rem;
            padding:.35rem 1.2rem;font-size:.78rem;cursor:pointer;
            transition:border-color .15s,color .15s;margin-top:.3rem;
        }
        .add-line-btn:hover{border-color:var(--c1);color:var(--c1);}

        /* recipient */
        .recipient-input{
            background:transparent;border:none;outline:none;
            font-size:.85rem;color:var(--c1);
            text-align:center;letter-spacing:.06em;
            caret-color:var(--c1);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:.15rem .5rem;
            transition:border-color .2s;
        }
        .recipient-input:focus{border-color:var(--c1);}
        .recipient-input::placeholder{color:rgba(255,107,157,.25);}

        /* cards list */
        #cards-section{
            position:relative;z-index:1;
            max-width:560px;margin:0 auto;
            padding:0 1rem 3rem;
        }
        .cards-title{
            font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;
            color:rgba(255,255,255,.25);margin-bottom:1rem;
            border-top:1px solid rgba(255,255,255,.08);padding-top:1.5rem;
        }
        .card-item{
            display:flex;align-items:flex-start;justify-content:space-between;
            gap:1rem;padding:.85rem 0;
            border-bottom:1px solid rgba(255,255,255,.06);
            flex-wrap:wrap;
        }
        .card-item-pov{font-size:.88rem;color:rgba(255,255,255,.7);flex:1 1 160px;}
        .card-item-pov small{display:block;color:var(--c1);font-size:.75rem;margin-top:.15rem;}
        .card-item-pov span{display:block;color:rgba(255,255,255,.3);font-size:.72rem;margin-top:.2rem;}
        .card-item-actions{display:flex;gap:.4rem;flex-shrink:0;flex-wrap:wrap;}
        .ci-btn{
            font-size:.75rem;padding:.3rem .7rem;border-radius:2rem;
            background:transparent;cursor:pointer;border:1px solid rgba(255,255,255,.15);
            color:rgba(255,255,255,.45);transition:.15s;white-space:nowrap;
        }
        .ci-btn:hover{border-color:var(--c1);color:var(--c1);}
        .ci-btn.danger:hover{border-color:#ff4444;color:#ff4444;}

        @media(max-width:420px){
            .toolbar{gap:.35rem;}
            .gen-btn{font-size:.78rem;padding:.4rem .85rem;}
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="auth-guard">در حال بررسی…</div>

<div class="toolbar" id="toolbar" style="display:none">
    <div class="toolbar-left">
        <button class="theme-btn active" data-theme="rose" title="رز" aria-label="تم رز"></button>
        <button class="theme-btn" data-theme="blue" title="آبی" aria-label="تم آبی"></button>
        <button class="theme-btn" data-theme="gold" title="طلایی" aria-label="تم طلایی"></button>
        <button class="theme-btn" data-theme="mint" title="نعنایی" aria-label="تم نعنایی"></button>
        <div class="toolbar-sep"></div>
        <a class="back-btn" href="/app/">← خانه</a>
    </div>
    <button class="gen-btn" id="gen-btn">ساخت لینک خصوصی</button>
</div>

<main id="main-editor" style="display:none">
    <div class="editor">
        <span class="pov-label">pov:</span>
        <input class="pov-input" id="pov-input" type="text"
               placeholder="you're in love with a nerd"
               maxlength="200" autocomplete="off" spellcheck="false" dir="auto">
        <div class="divider"></div>
        <div class="lines-area" id="lines-area"></div>
        <button class="add-line-btn" id="add-line-btn" type="button">+ اضافه کردن خط</button>
        <input class="recipient-input" id="recipient-input" type="text"
               placeholder="— اسم پارتنرت"
               maxlength="80" autocomplete="off" dir="auto">
    </div>

    <div id="cards-section" style="display:none">
        <p class="cards-title">کارت‌های قبلی</p>
        <div id="cards-list"></div>
    </div>
</main>

<div id="toast"></div>

<script src="/assets/site/scripts/auth.js?v=20260722-200509"></script>
<script src="/assets/site/scripts/pwa.js?v=20260722-200509"></script>
<script>
(function(){
    "use strict";

    /* ── theme ── */
    var THEMES = {
        rose: {c1:'#ff6b9d', c2:'#c0397a', bg:'#0d0010'},
        blue: {c1:'#6b9dff', c2:'#3965e0', bg:'#00060d'},
        gold: {c1:'#ffd166', c2:'#e09b20', bg:'#0d0900'},
        mint: {c1:'#66ffcc', c2:'#20c08a', bg:'#000d09'},
    };
    var currentTheme = 'rose';

    function applyTheme(t){
        currentTheme = t;
        var th = THEMES[t] || THEMES.rose;
        document.documentElement.style.setProperty('--c1', th.c1);
        document.documentElement.style.setProperty('--c2', th.c2);
        document.documentElement.style.setProperty('--bg', th.bg);
        document.body.style.background = th.bg;
        document.querySelectorAll('.theme-btn').forEach(function(b){
            b.classList.toggle('active', b.dataset.theme === t);
        });
    }

    document.querySelectorAll('.theme-btn').forEach(function(b){
        b.addEventListener('click', function(){ applyTheme(b.dataset.theme); });
    });

    /* ── canvas hearts ── */
    var canvas = document.getElementById('canvas');
    var ctx    = canvas.getContext('2d');
    var W, H, parts = [];

    function resize(){
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function P(init){
        this.x  = Math.random() * (W || 400);
        this.y  = init ? Math.random() * (H || 600) : (H || 600) + 15;
        this.r  = Math.random() * 5 + 2;
        this.vx = (Math.random() - .5) * .5;
        this.vy = -(Math.random() * .7 + .3);
        this.a  = Math.random() * .55 + .15;
        this.da = -(Math.random() * .002 + .001);
    }
    P.prototype.tick = function(){
        this.x += this.vx; this.y += this.vy; this.a += this.da;
        if(this.a <= 0 || this.y < -15){
            this.x  = Math.random() * W;
            this.y  = H + 15;
            this.r  = Math.random() * 5 + 2;
            this.vx = (Math.random() - .5) * .5;
            this.vy = -(Math.random() * .7 + .3);
            this.a  = Math.random() * .55 + .15;
            this.da = -(Math.random() * .002 + .001);
        }
    };
    for(var i = 0; i < 22; i++) parts.push(new P(true));

    function heart(c,x,y,r){
        c.save(); c.translate(x,y); c.scale(r/10,r/10);
        c.beginPath(); c.moveTo(0,-3);
        c.bezierCurveTo(0,-8,8,-8,8,-3);
        c.bezierCurveTo(8,2,0,8,0,10);
        c.bezierCurveTo(0,8,-8,2,-8,-3);
        c.bezierCurveTo(-8,-8,0,-8,0,-3);
        c.closePath(); c.restore();
    }

    function loop(){
        ctx.clearRect(0,0,W,H);
        var color = getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
        parts.forEach(function(p){
            p.tick();
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.a);
            ctx.fillStyle   = color;
            heart(ctx, p.x, p.y, p.r);
            ctx.fill();
            ctx.restore();
        });
        requestAnimationFrame(loop);
    }
    loop();

    /* ── lines editor ── */
    var linesArea = document.getElementById('lines-area');
    var lineCount = 0;

    function addLine(value){
        if(lineCount >= 12) return;
        lineCount++;
        var row = document.createElement('div');
        row.className = 'line-row';

        var inp = document.createElement('input');
        inp.className   = 'line-input';
        inp.type        = 'text';
        inp.maxLength   = 220;
        inp.placeholder = 'یه جمله برای پارتنرت…';
        inp.dir         = 'auto';
        inp.spellcheck  = false;
        inp.autocomplete = 'off';
        if(value) inp.value = value;

        var rem = document.createElement('button');
        rem.className   = 'line-remove';
        rem.type        = 'button';
        rem.textContent = '×';
        rem.title       = 'حذف';
        rem.addEventListener('click', function(){
            row.remove();
            lineCount--;
        });

        row.appendChild(inp);
        row.appendChild(rem);
        linesArea.appendChild(row);

        inp.focus();
    }

    /* start with 3 empty lines */
    addLine(); addLine(); addLine();

    document.getElementById('add-line-btn').addEventListener('click', function(){
        addLine();
    });

    /* ── toast ── */
    var toastEl = document.getElementById('toast');
    var toastTimer;
    function showToast(msg, duration){
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, duration || 3500);
    }

    /* ── copy ── */
    function copyText(text, done){
        if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(function(){ done && done(true); }).catch(function(){ done && done(false); });
        } else {
            var a = document.createElement('textarea');
            a.value = text; a.style.position='fixed'; a.style.left='-9999px';
            document.body.appendChild(a); a.select();
            var ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
            a.remove(); done && done(ok);
        }
    }

    /* ── API ── */
    function apiPost(action, body){
        return fetch('/api/msg_api.php?action=' + encodeURIComponent(action), {
            method:'POST', credentials:'same-origin',
            headers:{'Accept':'application/json','Content-Type':'application/json'},
            body:JSON.stringify(body||{})
        }).then(function(r){ return r.json().then(function(d){ d.httpStatus=r.status; return d; }); })
          .catch(function(){ return {success:false,error:'خطای شبکه'}; });
    }

    function apiGet(action, params){
        var qs = new URLSearchParams(Object.assign({action:action}, params||{}));
        return fetch('/api/msg_api.php?' + qs, {
            credentials:'same-origin', headers:{'Accept':'application/json'}
        }).then(function(r){ return r.json().then(function(d){ d.httpStatus=r.status; return d; }); })
          .catch(function(){ return {success:false,error:'خطای شبکه'}; });
    }

    /* ── generate ── */
    var genBtn = document.getElementById('gen-btn');
    genBtn.addEventListener('click', function(){
        var povLine = (document.getElementById('pov-input').value || '').trim();
        if(!povLine){ showToast('جمله POV رو بنویس'); return; }

        var lines = [];
        linesArea.querySelectorAll('.line-input').forEach(function(inp){
            var v = inp.value.trim();
            if(v) lines.push(v);
        });

        var recipient = (document.getElementById('recipient-input').value || '').trim();

        genBtn.disabled = true;
        genBtn.textContent = '…';

        apiPost('create', {
            povLine: povLine,
            lines:   lines,
            recipientName: recipient,
            theme: currentTheme
        }).then(function(res){
            genBtn.disabled = false;
            genBtn.textContent = 'ساخت لینک خصوصی';
            if(res.success){
                var url = location.origin + (res.publicUrl || '');
                copyText(url, function(){
                    showToast('لینک کپی شد! ' + url, 5000);
                    loadCards();
                });
            } else {
                showToast(res.error || 'خطا در ساخت کارت');
            }
        });
    });

    /* ── cards list ── */
    function formatDate(v){
        var d = new Date(String(v||''));
        if(!isFinite(d.getTime())) return '';
        return d.toLocaleString('fa-IR-u-ca-persian',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    }

    function escHtml(v){
        return String(v||'').replace(/[&<>"']/g,function(c){
            return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c;
        });
    }

    function loadCards(){
        apiGet('list').then(function(res){
            if(!res.success || !res.cards || !res.cards.length){
                document.getElementById('cards-section').style.display = 'none';
                return;
            }
            document.getElementById('cards-section').style.display = '';
            var html = res.cards.map(function(c){
                var url = location.origin + (c.publicUrl||'');
                var views = Number(c.viewCount||0).toLocaleString('fa-IR');
                return [
                    '<div class="card-item">',
                    '  <div class="card-item-pov">',
                    '    pov: ' + escHtml(c.povLine||''),
                    c.recipientName ? '<small>برای: ' + escHtml(c.recipientName) + '</small>' : '',
                    '    <span>' + escHtml(formatDate(c.createdAt)) + ' · ' + views + ' بازدید</span>',
                    '  </div>',
                    '  <div class="card-item-actions">',
                    '    <button class="ci-btn" data-copy="' + escHtml(url) + '">کپی</button>',
                    '    <a class="ci-btn" href="' + escHtml(c.publicUrl||'') + '" target="_blank" rel="noopener">مشاهده</a>',
                    '    <button class="ci-btn danger" data-del="' + escHtml(c.id) + '" data-pov="' + escHtml(c.povLine||'') + '">حذف</button>',
                    '  </div>',
                    '</div>'
                ].join('');
            }).join('');
            document.getElementById('cards-list').innerHTML = html;

            document.querySelectorAll('[data-copy]').forEach(function(b){
                b.addEventListener('click',function(){
                    copyText(b.dataset.copy,function(ok){ showToast(ok?'کپی شد':'خطای کپی'); });
                });
            });
            document.querySelectorAll('[data-del]').forEach(function(b){
                b.addEventListener('click',function(){
                    if(!confirm('حذف کارت «pov: ' + b.dataset.pov + '»?')) return;
                    b.disabled = true;
                    apiPost('delete',{id:b.dataset.del}).then(function(r){
                        if(r.success) loadCards();
                        else{ b.disabled=false; showToast(r.error||'خطا'); }
                    });
                });
            });
        });
    }

    /* ── auth ── */
    function boot(){
        if(!window.Dent1402Auth){
            document.getElementById('auth-guard').textContent = 'خطای بارگذاری auth';
            return;
        }
        window.Dent1402Auth.ready().then(function(state){
            var guard = document.getElementById('auth-guard');
            if(!state.loggedIn){
                guard.textContent = 'باید وارد شوید.';
                window.Dent1402Auth.showLogin && window.Dent1402Auth.showLogin();
                return;
            }
            if((state.user && state.user.role) !== 'owner'){
                guard.textContent = 'دسترسی فقط برای مالک.';
                return;
            }
            guard.style.display = 'none';
            document.getElementById('toolbar').style.display = '';
            document.getElementById('main-editor').style.display = '';
            loadCards();
        });
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
}());
</script>
</body>
</html>
