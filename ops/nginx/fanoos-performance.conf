# Compression and asset caching for the fanooslearn.ir vhost.
#
# Production serves the platform through nginx (nginx/1.24.0, unix socket
# php-fpm). apps/platform/public/.htaccess is an Apache fallback for hosts
# that read it and is NEVER consulted in production -- anything written
# there about compression or caching describes a server we do not run.
#
# Installed as /etc/nginx/snippets/fanoos-performance.conf and pulled into
# the vhost's server block with:
#
#     include snippets/fanoos-performance.conf;
#
# It lives in the repository rather than only on the server so the rule is
# reviewable and so the next person can see why it is shaped this way.

# nginx.conf ships `gzip on;` with gzip_types left at its default, which is
# text/html alone -- so every .js and .css file was served raw. Naming the
# types here rather than editing the global nginx.conf keeps the change
# scoped to this vhost.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
# woff2 is deliberately absent: it is already compressed, and gzipping it
# spends CPU to make the response marginally larger.

location ^~ /assets/ {
    # Asset URLs carry ?v=<release sha> (Web\AssetVersioner), so a release
    # that changes a file changes its URL. That is what makes `immutable`
    # honest here rather than a promise we cannot keep.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # nginx does not merge add_header directives across levels: the moment a
    # location declares one of its own, every add_header inherited from the
    # server block is dropped. These three are repeated on purpose -- remove
    # them and this location silently starts serving assets without the
    # site's security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    try_files $uri =404;
}
